
---
- name: Install and configure Nginx reverse proxy
  hosts: all
  become: yes

  vars:
    private_ec2_ip: "10.0.2.92"
    proxy_port: 8080

  tasks:
    - name: Update all packages
      ansible.builtin.yum:
        name: "*"
        state: latest
        update_cache: yes

    - name: Install Nginx
      ansible.builtin.yum:
        name: nginx
        state: present

    - name: Ensure Nginx system user exists
      ansible.builtin.user:
        name: nginx
        system: yes
        create_home: no
        shell: /sbin/nologin
        state: present

    - name: Create Nginx configuration directory
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory
        mode: "0755"

    - name: Configure Nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/reverse-proxy.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen {{ proxy_port }};
              server_name _;

              location / {
                  proxy_pass http://{{ private_ec2_ip }}:80;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Restart Nginx

    - name: Enable SELinux HTTP proxy connections
      ansible.builtin.command:
        cmd: setsebool -P httpd_can_network_relay on
      when: ansible_selinux.status | default('disabled') == 'enabled'
      changed_when: false

    - name: Ensure Nginx is started and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

  handlers:
    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
